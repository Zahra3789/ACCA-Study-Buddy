<style>

/* ---------- exam hall: CBE structure (timer, question n of N, flag, navigator) in the game's own art */
#exam { background: linear-gradient(#141a33 0%, #3c4a7a 45%, #2a1e2e 100%); padding: 58px 26px 20px; gap: 12px; }
#exHead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 36px 36px 38px; min-height: 134px; box-sizing: border-box; flex: none; }
#exHead > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
#exQno { font-weight: 700; font-size: 26px; color: #8c2b3c; } #exTime { font-size: 24px; color: #33497a; white-space: nowrap; } #exTime.low { color: #c8414b; font-weight: 700; }
#exFlag { flex: none; min-height: 58px; min-width: 150px; padding: 6px 20px; font-size: 24px; } #exFlag.on { filter: brightness(1.15); box-shadow: 0 0 0 5px #ffe39a; }
#exFrame { flex: 1; min-height: 0; display: flex; padding: 52px 40px 40px; }
#exBody { flex: 1; min-height: 0; overflow-y: auto; font-size: 26px; line-height: 1.3; scrollbar-width: none; padding-bottom: 28px; -webkit-mask-image: linear-gradient(#000 calc(100% - 28px), transparent); mask-image: linear-gradient(#000 calc(100% - 28px), transparent); }
#exBody::-webkit-scrollbar { display: none; }
#exQ { margin-bottom: 14px; } .exTopic { font-size: 20px; color: #6e3f33; margin-bottom: 6px; font-style: italic; }
.exHint { font-size: 21px; color: #6e3f33; margin: 6px 0; }
#exAns { display: flex; flex-direction: column; gap: 10px; }
#exAns .btn.exOpt { position: relative; text-align: left; padding: 20px 24px 20px 74px; min-height: 84px; font-size: 25px; line-height: 1.1; flex: none; }
#exAns .btn.exOpt .k { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(43,29,42,.6); display: flex; align-items: center; justify-content: center; font-size: 24px; }
#exAns .btn.exOpt.picked { filter: brightness(1.12); box-shadow: 0 0 0 6px #ffe39a; }
#exAns input[type=text] { font-family: Body, sans-serif; font-size: 30px; color: #3e2731; background: none; outline: none; padding: 30px 34px; width: 100%; box-sizing: border-box; }
.exPick { line-height: 1.9; } .exPick select { font-family: Body, sans-serif; font-size: 25px; color: #3e2731; background: #fff4d6; border: 3px solid #6e3f33; border-radius: 6px; padding: 2px 6px; margin: 0 4px; max-width: 100%; }
.exSort { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 2px solid rgba(62,39,49,.25); } .exSort .t { flex: 1 1 100%; font-size: 24px; }
.exSort .btn { min-height: 52px; padding: 6px 16px; font-size: 22px; flex: 1; } .exSort .btn.picked { filter: brightness(1.15); box-shadow: 0 0 0 5px #ffe39a; }
#exNav { display: flex; gap: 8px; flex: none; } #exNav .btn { flex: 1; min-height: 64px; padding: 6px 4px; font-size: 24px; } #exNav .btn:disabled { opacity: .45; }
.exGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.exCell { font-family: Body, sans-serif; font-weight: 700; font-size: 24px; padding: 12px 0; text-align: center; border: 3px solid #6e3f33; border-radius: 8px; background: #fff4d6; color: #3e2731; cursor: pointer; }
.exCell.done { background: #33497a; color: #fff6e6; border-color: #2b1d2a; } .exCell.flag { box-shadow: inset 0 0 0 4px #e0892b; } .exCell.cur { outline: 4px solid #f2c14e; }
.exRes { font-family: RpgTitleO, serif; font-size: 40px; letter-spacing: 1px; padding: 14px 18px; border-radius: 10px; color: #fff6e6; text-align: center; text-shadow: 3px 3px 0 #2b1d2a; } .exRes.pass { background: #1a804d; } .exRes.fail { background: #b3243b; }
.exRev { padding: 10px 12px; border-left: 6px solid #1a804d; background: rgba(255,255,255,.35); border-radius: 4px; font-size: 22px; line-height: 1.3; } .exRev.bad { border-left-color: #b3243b; }
.exNavRow { display: flex; gap: 8px; } .exNavRow .btn { flex: 1; min-height: 60px; padding: 6px 4px; font-size: 21px; }
.exTabs { display: flex; gap: 6px; flex-wrap: wrap; } .exTabs .btn { flex: 1; min-height: 52px; padding: 4px 6px; font-size: 21px; }
#exAns .tbl input { width: 140px; }
.exRes { font-size: 32px; }
#menuScroll.tight, #lessonBox.tight { font-size: 24px; } #menuScroll.tighter, #lessonBox.tighter { font-size: 21px; }
#menuScroll.tight .btn, #menuScroll.tighter .btn { font-size: 24px; min-height: 56px; padding-top: 6px; padding-bottom: 6px; }
#menuScroll.tight, #menuScroll.tighter, #lessonBox.tight, #lessonBox.tighter { gap: 8px; }
#dlgText b, .card b { font-weight: 600; }
#cmds .btn .k { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%;
  background: rgba(43,29,42,.55); color: #fff6e6; font-family: RpgTitle, serif; display: flex; align-items: center; justify-content: center; text-shadow: none; }
#cmds .wide { grid-column: span 2; min-height: 64px; padding-left: 28px; text-align: center; }
#cmds input { grid-column: span 2; font-family: Body, sans-serif; font-size: 30px; color: #3e2731; background: none; outline: none; padding: 30px 34px; }
.ta { margin-top: 10px; background: #fff4d6; border: 3px solid #6e3f33; border-radius: 4px; padding: 6px 10px; }
.ta .t { text-align: center; color: #8c2b3c; font-family: RpgTitle, serif; }
.ta .cols { display: flex; } .ta .col { flex: 1; padding: 0 6px; } .ta .col + .col { border-left: 3px solid #6e3f33; }
.ta .hd { color: #33497a; }
#note { position: fixed; left: 8px; bottom: 6px; color: #8a86a0; font: 12px sans-serif; }

/* ---------- exam question types in battle */
#cmds .btn.picked { filter: brightness(1.15); box-shadow: 0 0 0 6px #ffe39a; }
#cmds .panelq { grid-column: span 2; line-height: 1.9; padding: 40px 40px; }
#cmds select { font-family: Body, sans-serif; font-size: 26px; color: #3e2731; background: #fff4d6; border: 3px solid #6e3f33; border-radius: 6px; padding: 2px 6px; margin: 0 4px; max-width: 560px; }
#cmds .sortrow { grid-column: span 2; display: grid; grid-template-columns: 1fr 150px 150px; gap: 8px; align-items: center; color: #fbe9d0; }
#cmds .sortrow .btn { min-height: 56px; padding: 8px 10px; text-align: center; font-size: 24px; }
#cmds .sortrow.narrow { font-size: 24px; } #cmds .sortrow.narrow .btn { font-size: 18px; padding: 6px 4px; line-height: 1.05; }
.marks { position: absolute; right: 26px; top: 14px; z-index: 3; background: #2b1d2a; color: #ffe39a; border-radius: 14px; padding: 2px 12px; font-size: 22px; }

/* ---------- tables (lessons, worked examples, Section B) */
.tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 24px; background: #fff4d6; }
.tbl th { background: #6e3f33; color: #fff4d6; font-weight: 600; text-align: left; padding: 6px 8px; }
.tbl td { border-top: 2px solid #e2c49a; padding: 5px 8px; color: #3e2731; }
.tbl td, .tbl th { overflow-wrap: break-word; vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; white-space: nowrap; }
.tbl tr.b td { font-weight: 700; border-top: 3px solid #6e3f33; }
.tbl tr.new td { background: #ffe39a; animation: pop .5s; }
@keyframes pop { from { background: #fff; } }
.tbl input { width: 150px; font-family: Body, sans-serif; font-size: 24px; text-align: right; border: 3px solid #4f74b3; border-radius: 6px; padding: 2px 6px; background: #fff; }
.tbl input.ok { border-color: #2e8b57; background: #d9f5df; } .tbl input.bad { border-color: #c8414b; background: #ffe0e0; }

/* ---------- lesson screen */
#lesson { background: linear-gradient(#1f5d63, #2a1e2e); padding: 58px 26px 24px; gap: 14px; }
#lessonSteps { display: flex; gap: 8px; justify-content: center; }
/* Zuru sits in the top-right corner of the lesson frame, listening to Sensei (inside the frame's padding, never over text). */
#lesson { position: relative; }
#lessonYou { position: absolute; right: 44px; top: 232px; width: 84px; height: 91px; z-index: 3; animation: bob 1.6s ease-in-out infinite; }
#lessonBox > .title, #lessonOutcome { padding-right: 70px; }   /* keep the heading clear of Zuru */
.senseiLine { font-size: 22px; color: #6e3f33; font-style: italic; border-left: 4px solid rgba(140,43,60,.5); padding-left: 10px; }
.applyHead { font-weight: 700; color: #1a804d; background: rgba(26,128,77,.12); border-left: 6px solid #1a804d; padding: 6px 12px; border-radius: 4px; }
#mtqYou { width: 90px; height: 98px; flex: none; animation: bob 1.6s ease-in-out infinite; }
#lessonSteps span { padding: 4px 14px; border-radius: 14px; background: rgba(255,255,255,.15); color: #fbe9d0; font-size: 22px; }
#lessonSteps span.on { background: #ffe39a; color: #3e2731; }
#lessonFrame { flex: 1; min-height: 0; display: flex; padding-top: 44px; }
#lessonBox { flex: 1; min-height: 0; overflow-y: auto; line-height: 1.3; display: flex; flex-direction: column; gap: 10px; }
#lessonBox > * { flex: none; }
#lessonBox b { color: #8c2b3c; font-weight: 600; }
#lessonOutcome { font-size: 22px; color: #33497a; margin-bottom: 8px; }
#lessonNav { display: flex; gap: 12px; } #lessonNav .btn { flex: 1; }
#lessonSpeaker { align-self: flex-start; margin: 0 0 -60px 26px; position: relative; z-index: 2; height: 48px; padding: 0 34px 6px; border-image-slice: 15 24 fill; border-image-width: 15px 24px; }

/* ---------- Section B (MTQ) */
#mtq { background: linear-gradient(#3a0f1e, #2a1e2e); padding: 58px 20px 20px; gap: 12px; }
#mtqHead { display: flex; align-items: center; gap: 14px; }
#mtqHead img { width: 111px; height: 99px; filter: hue-rotate(141deg); }
#mtqHead .bar { flex: 1; }
#mtqTabs { display: flex; gap: 8px; } #mtqTabs .btn { flex: 1; min-height: 56px; font-size: 24px; padding: 8px; }
#mtqFrame { flex: 1; min-height: 0; display: flex; }
#mtqBox { flex: 1; min-height: 0; overflow-y: auto; line-height: 1.3; display: flex; flex-direction: column; gap: 10px; }
#mtqBox > * { flex: none; }
#mtqBox .exl { margin-top: 10px; font-size: 24px; }
#mtqBox .exl div { margin-top: 6px; }
#mtqNav { display: flex; gap: 12px; } #mtqNav .btn { flex: 1; }
#chapDetail { overflow: hidden; min-height: 0; }
#chapDetail .path { overflow-y: auto; min-height: 0; }
#chapDetail .path > * { flex: none; }   /* Firefox squashes buttons in a scrolling column otherwise */

/* ---------- calculator */
#voiceBtn { position: absolute; left: 108px; top: 6px; z-index: 40; min-height: 44px; padding: 2px 14px; font-size: 20px; }
#sfxBtn { position: absolute; left: 290px; top: 6px; z-index: 40; min-height: 44px; padding: 2px 14px; font-size: 20px; }
#saveRow { display: flex; gap: 8px; margin-top: 8px; } #saveRow .btn { flex: 1; min-height: 44px; padding: 4px 10px; font-size: 22px; }
.backupPanel { grid-column: span 2; align-self: start; display: flex; flex-direction: column; gap: 12px; padding: 44px 44px 40px; }
#codeBox { width: 100%; height: 150px; box-sizing: border-box; font: 15px monospace; color: #3e2731; background: #fff4d6; border: 3px solid #6e3f33; border-radius: 6px; margin-top: 8px; user-select: text; resize: none; }
#verdict { position: absolute; left: 50%; top: 230px; transform: translateX(-50%) rotate(-6deg); font-family: Body, sans-serif; font-weight: 700; font-size: 84px; letter-spacing: 2px; padding: 14px 40px; border-radius: 14px; pointer-events: none; z-index: 5; animation: verdictPop .25s; text-shadow: 4px 4px 0 #2b1d2a; }
#verdict.good { color: #ffffff; background: #1f9a4f; box-shadow: 0 0 0 8px #2b1d2a, 0 0 40px rgba(0,0,0,.5); }
#verdict.bad { color: #ffffff; background: #c8233f; box-shadow: 0 0 0 8px #2b1d2a, 0 0 40px rgba(0,0,0,.5); }
@keyframes verdictPop { from { transform: translateX(-50%) rotate(-6deg) scale(.3); opacity: 0; } }
#calcGrip { position: absolute; right: 22px; bottom: 18px; width: 44px; height: 44px; font-size: 40px; line-height: 44px; text-align: center; color: #ffe39a; cursor: nwse-resize; touch-action: none; user-select: none; text-shadow: 2px 2px 0 #2b1d2a; }
#escBtn { color: #3e2731; }
/* top bar: six equal buttons with even gaps */
#topBar { position: absolute; left: 10px; right: 10px; top: 6px; display: flex; gap: 8px; z-index: 40; }
#topBar .btn { position: static; flex: 1 1 0; min-width: 0; min-height: 44px; padding: 2px 2px; font-size: 17px; white-space: nowrap; overflow: hidden; line-height: 1; }
#topBar .btn img { height: 30px; width: auto; image-rendering: pixelated; vertical-align: middle; }
#calc { position: absolute; left: 30px; top: 58px; width: 660px; height: 780px; min-width: 440px; min-height: 660px; max-width: 720px; max-height: 1222px; box-sizing: border-box; z-index: 41; padding: 40px 40px 36px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
#calc .calcTop { display: flex; justify-content: space-between; align-items: center; cursor: move; touch-action: none; }
#calc .calcTop .title::after { content: "  (drag me)"; font-size: 18px; opacity: .7; font-weight: 400; }
#calcExpr, #calcTape, #cmds input, #mtqBox input, .tbl td { user-select: text; }
#calc .calcTop .btn { min-height: 48px; font-size: 22px; padding: 4px 16px; }
#calcTape { flex: 1; overflow-y: auto; background: rgba(0,0,0,.25); border-radius: 6px; padding: 4px 10px; font-size: 22px; min-height: 40px; }
#calcTape div { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.15); padding: 3px 0; }
#calcTape div:hover { color: #ffe39a; }
#calcExpr { font-family: Body, sans-serif; font-size: 34px; text-align: right; padding: 6px 12px; border: 3px solid #2b1d2a; border-radius: 6px; background: #fff4d6; color: #3e2731; }
#calcLive { text-align: right; font-size: 34px; min-height: 42px; color: #ffe39a; font-weight: 600; }
#calcKeys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
#calcKeys .btn { min-height: 66px; padding: 4px; font-size: 30px; text-align: center; }
#chapDetail .path { grid-column: span 2; display: flex; flex-direction: column; gap: 8px; }
#chapDetail .path .btn { font-size: 26px; text-align: left; min-height: 60px; }
</style>
</head>

<div id="stage"><div id="screen">

  <!-- HOME -->
  <canvas id="snow" class="hidden" width="720" height="1280"></canvas>

  <!-- TITLE: pick the exam -->

    <img class="xgift a" data-src="../assets/xmas/present.png" alt=""><img class="xgift b" data-src="../assets/xmas/present.png" alt=""><img class="xgift c" data-src="../assets/xmas/present.png" alt="">
    <img class="xpump l" data-src="../assets/xmas/pumpkin.png" alt=""><img class="xpump r" data-src="../assets/xmas/pumpkin.png" alt=""><img class="xpump s" data-src="../assets/xmas/pumpkin.png" alt="">
    <div class="speech box dark" data-art="BGbox_04A" id="titleSay"></div>
    <div id="examList"></div>
    <div class="note">Zuru's dojo - choose an exam to enter</div>
  </div>

  <div id="home" class="screen">
    <div class="banner titleO light" data-art="BannerMedium_02C">ACCA STUDY BUDDY</div>
    <div class="hero">
      <img data-src="../assets/characters/samurai.png" data-zuru alt="">
      <div class="speech box dark" data-art="BGbox_04A">
        <div id="topRow"><button class="btn light" data-btn="03A" onclick="showPlan()">&#128197; Study plan</button><button class="btn light" data-btn="06A" onclick="showNotebook()">&#128211; Notebook</button></div>
        <div id="homeSay"></div>
        <div class="lvl"><span class="title" id="homeLvl"></span><div class="bar xp" data-art="Slider01_Box"><i></i></div><button class="btn dark" data-btn="04A" id="resetBtn" onclick="askReset()">Reset</button></div>
        <div id="saveRow"><button class="btn light" data-btn="05A" onclick="askBackup()">Backup</button><button class="btn light" data-btn="02A" onclick="askRestore()">Restore</button></div>
      </div>
    </div>
    <div id="cards"></div>
  </div>

  <!-- BOOK -->
  <div id="book" class="screen hidden">
    <div class="banner titleO light" data-art="BannerMedium_02C">CHAPTER BOOK</div>
    <div id="bookInfo"></div>
    <div id="bookWrap">
      <img id="bookImg" data-src="../assets/rpg/Spellbook.png" alt="">
      <div id="pageTurn"></div>
      <div class="page" id="pageL"></div><div class="page" id="pageR"></div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div id="chapDetail" class="box dark" data-art="BGbox_03A"></div>
    <button class="btn light" data-btn="05A" style="width:660px" onclick="showHome()">Home</button>
  </div>

  <!-- LESSON (learn -> worked example -> your turn) -->
  <div id="lesson" class="screen hidden">
    <div class="banner titleO light" id="lessonBanner" data-art="BannerMedium_02C"></div>
    <div id="lessonSteps"></div>
    <div id="lessonSpeaker" class="banner light" data-art="BannerSmall_02C">SENSEI OTTER</div>
    <img id="lessonYou" data-src="../assets/characters/samurai.png" data-zuru alt="" title="Zuru">
    <div id="lessonFrame" class="box dark" data-art="BGbox_04A"><div id="lessonBox"></div></div>
    <div id="lessonNav"></div>
  </div>

  <!-- SECTION B multi-task question -->
  <div id="mtq" class="screen hidden">
    <div id="mtqHead"><img data-src="../assets/monster.png" id="mtqFoe" alt=""><div style="flex:1;color:#fbe9d0"><div class="title" id="mtqTitle"></div><div class="bar" id="mtqHp" data-art="Slider01_Box"><i></i></div><div id="mtqScore" style="font-size:24px"></div></div><img id="mtqYou" data-src="../assets/characters/samurai.png" data-zuru alt="" title="Zuru"></div>
    <div id="mtqTabs"></div>
    <div id="mtqFrame" class="box dark" data-art="BGbox_04A"><div id="mtqBox"></div></div>
    <div id="mtqNav"></div>
  </div>

  <!-- EXAM HALL: CBE-style mock - laid out like the real ACCA exam screen, not a battle -->
  <div id="exam" class="screen hidden">
    <div class="banner titleO light" data-art="BannerMedium_02C" id="exTitle"></div>
    <div id="exHead" class="box dark" data-art="BGbox_01A"><div><div id="exQno"></div><div id="exTime"></div></div><button class="btn light" data-btn="03A" id="exFlag" onclick="exFlag()"></button></div>

  </div>

  <!-- Top bar: the same six buttons on every screen, evenly spaced -->
  <div id="topBar">
    <button id="escBtn" class="btn light" data-btn="04A" onclick="escapeScreen()">ESC</button>
    <button id="voiceBtn" class="btn light" data-btn="05A" onclick="toggleVoice()">VOICE OFF</button>

  for (const c of EXAM.chapters) { if (chId !== -1 && c.id !== chId) continue; c.beats.forEach((b, i) => { if (isQ(b) && (!kind || b.type === kind)) out.push(tag(c, i)); });

  const given = t.rows.filter(r => !r.c.some(x => String(x).startsWith('#'))).map(r => r.c.filter(x => x !== '').join('  ')).join('\n');
  return { type: 'input', q: `[b]${m.title} - ${t.title}[/b]\n${scen}${given ? '\n[b]Figures so far:[/b]\n' + given + '\n' : ''}\nWhat is the figure for [b]${label}[/b]?`, accept: bl.accept, display_answer: bl.show, ex: bl.ex,
    _key: `${examId}/${c.id}/mtq/${ti}/${key}`, _ch: `${examId}/${c.id}`, _topic: `${c.title}: Section B` }; }

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Short dialogue pages: split on blank lines, then sentences, max ~150 chars a page.
function pages(text) { const out = [];

    for (const s of sents) { if (cur && (cur + s).length > 150) { out.push(cur.trim()); cur = ''; } cur += s; }
    if (cur.trim()) out.push(cur.trim()); }
  return out.length ? out : ['']; }

const today0 = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };

function buildPlan() {

  const days = []; for (let d = new Date(first); d < exam; d = addDays(d, 1)) { const we = d.getDay() === 0 || d.getDay() === 6; days.push({ date: d, cap: (we ? P.we : P.wd) * 60, items: [], used: 0 }); }

function S(key, vars = {}) { const v = SENSEI[key][settings.sensei === 'east' ? 'east' : 'proper']; let t = Array.isArray(v) ? v[Math.floor(Math.random() * v.length)] : v; for (const [k, val] of Object.entries(vars)) t = t.split('{' + k + '}').join(val); return t; }

// Sound effects: WAV files in assets/sfx (made by tools/make_sfx.ps1, also used by the Godot build);

// Zuru's face: happy after a right answer, distressed after a wrong one, back to normal after a moment.
const ZURU = { normal: '../assets/characters/samurai.png', happy: '../assets/characters/samurai_happy.png', sad: '../assets/characters/samurai_sad.png' };

const zuruSrc = m => A((festive() ? ZURU_X : spooky() ? ZURU_H : ZURU)[m]);
function mood(m, id = 'you', ms = 2600) { const im = $(id); if (!im) return; im.src = zuruSrc(m); clearTimeout(im._mood); if (m !== 'normal') im._mood = setTimeout(() => im.src = zuruSrc('normal'), ms); }

// ---------------------------------------------------------------- THEMES (only when she picks one - THEME button in the top bar)
// off -> Christmas (snow, lights, trees, Santa-hat Zuru, bells) -> Halloween (bats + falling leaves, pumpkins, witch-hat Zuru) -> off.
// The choice is saved with the other settings in this browser (accaStudyBuddy.settings.v1) and travels in the Backup code.
function theme() { return settings.theme === 'xmas' || settings.theme === 'halloween' ? settings.theme : ''; }
function festive() { return theme() === 'xmas'; }
function spooky() { return theme() === 'halloween'; }
function toggleTheme() { settings.theme = settings.theme === 'xmas' ? 'halloween' : settings.theme === 'halloween' ? 'off' : 'xmas'; saveSettings(); applyFestive(); if (!$('title').classList.contains('hidden')) showTitle(); }

let fxRunning = false, batImg = null;

  for (const im of document.querySelectorAll('img[data-zuru]')) if (!im._mood || t !== im._xm) { im.src = zuruSrc('normal'); im._xm = t; }
  const strip = document.querySelector('#xmasDeco .lights'); if (strip) strip.style.backgroundImage = t ? `url(${A(t === 'xmas' ? '../assets/xmas/lights.png' : '../assets/xmas/bunting.png')})` : '';
